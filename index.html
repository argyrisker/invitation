<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argyrios &amp; Tomislav · 10.04.2027</title>
<meta name="description" content="Argyrios &amp; Tomislav · Stockholm City Hall, 10 April 2027. RSVP.">
<meta name="theme-color" content="#0f2440">

<!-- Link preview when the invitation is shared in WhatsApp, Messenger, iMessage.
     Change the two absolute URLs if the site lives somewhere other than
     https://argyrisker.github.io/invitation/ -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://argyrisker.github.io/invitation/">
<meta property="og:title" content="Argyrios &amp; Tomislav · 10.04.2027">
<meta property="og:description" content="Stockholm City Hall, Saturday 10 April 2027. Dinner at 18:00. Please RSVP by 31 December 2026.">
<meta property="og:image" content="https://argyrisker.github.io/invitation/assets/img/couple.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking: the invitation renders instantly with system fonts even
     on a slow connection, then upgrades when the webfonts arrive. -->
<!-- Cardo and Commissioner both ship Greek, Latin Extended and Cyrillic,
     so Swedish (å ä ö), Croatian (č ć ž š đ) and Greek all render in the same
     typeface instead of falling back to a system font. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Commissioner:wght@300;400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Commissioner:wght@300;400;500&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
</head>
<body>

<!-- ── language switcher ─────────────────────────────────────────────── -->
<header class="langbar">
  <nav class="langbar__inner" aria-label="Language">
    <button class="lang" data-lang="sv" lang="sv" type="button">Svenska</button>
    <button class="lang" data-lang="el" lang="el" type="button">Ελληνικά</button>
    <button class="lang" data-lang="en" lang="en" type="button">English</button>
    <button class="lang" data-lang="hr" lang="hr" type="button">Hrvatski</button>
  </nav>
</header>

<main>

  <!-- ── hero ────────────────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero__frame">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>

      <h1 class="names">
        <span>Argyrios</span>
        <span class="amp" aria-hidden="true">&amp;</span>
        <span>Tomislav</span>
      </h1>

      <!-- Stockholm City Hall silhouette -->
      <svg class="cityhall" viewBox="0 0 320 132" role="img" aria-labelledby="chTitle">
        <title id="chTitle">Stockholms stadshus</title>
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M2 130h316"/>
          <!-- main block -->
          <path d="M96 130V64h150v66"/>
          <path d="M96 64l12-10h126l12 10"/>
          <!-- arcade -->
          <path d="M104 130v-22a8 8 0 0 1 16 0v22M132 130v-22a8 8 0 0 1 16 0v22M160 130v-22a8 8 0 0 1 16 0v22M188 130v-22a8 8 0 0 1 16 0v22M216 130v-22a8 8 0 0 1 16 0v22"/>
          <!-- windows -->
          <path d="M108 74h10v14h-10zM136 74h10v14h-10zM164 74h10v14h-10zM192 74h10v14h-10zM220 74h10v14h-10z"/>
          <!-- tower -->
          <path d="M246 130V34h34v96"/>
          <path d="M246 34l17-10 17 10"/>
          <path d="M250 44h26M250 56h26"/>
          <path d="M252 68h8v14h-8zM266 68h8v14h-8zM252 94h8v14h-8zM266 94h8v14h-8z"/>
          <!-- lantern + spire -->
          <path d="M252 24v-6h22v6M258 18V8h10v10"/>
          <path d="M263 8V0"/>
          <!-- left wing -->
          <path d="M40 130V88h56M40 88l8-8h48"/>
          <path d="M48 96h10v12H48zM68 96h10v12H68z"/>
        </g>
        <!-- Tre Kronor -->
        <g class="crowns" fill="currentColor">
          <path d="M259.4 2.6h7.2l-.8 3.2h-5.6zM259.6 2.2l.9-1.6.9 1.3.9-1.7.9 1.7.9-1.3.9 1.6z"/>
        </g>
      </svg>

      <p class="hero__meta">
        <span data-i18n="hero.date"></span>
        <span class="dot" aria-hidden="true">•</span>
        <span data-i18n="hero.city"></span>
      </p>

      <a class="btn btn--ghost" href="#rsvp" data-i18n="nav.rsvp"></a>
    </div>
  </section>

  <!-- ── three cultures divider ──────────────────────────────────────── -->
  <div class="divider" aria-hidden="true">
    <svg class="motif" viewBox="0 0 60 24"><title>Greek key</title>
      <path fill="none" stroke="currentColor" stroke-width="1.6"
            d="M2 22V6h14v10H8v-4h4M22 22V6h14v10h-8v-4h4M42 22V6h14v10h-8v-4h4"/>
    </svg>
    <svg class="motif motif--big" viewBox="0 0 48 48"><title>Crown</title>
      <path fill="none" stroke="currentColor" stroke-width="1.6"
            d="M10 34h28l3-18-9 7-8-12-8 12-9-7zM10 38h28"/>
    </svg>
    <svg class="motif" viewBox="0 0 60 24"><title>Croatian pleter</title>
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M2 12Q9 2 16 12T30 12T44 12T58 12"/>
        <path d="M2 12Q9 22 16 12T30 12T44 12T58 12"/>
      </g>
    </svg>
  </div>

  <!-- ── invitation ──────────────────────────────────────────────────── -->
  <section class="section">
    <div class="wrap invite-grid">
      <figure class="photo">
        <picture>
          <source srcset="assets/img/couple.webp" type="image/webp">
          <img src="assets/img/couple.jpg" width="900" height="1350" loading="lazy"
               data-i18n-attr="alt:invite.photoAlt">
        </picture>
        <figcaption data-i18n="invite.caption"></figcaption>
      </figure>
      <div class="invite-text center">
        <h2 class="section__title" data-i18n="invite.title"></h2>
        <p class="lede" data-i18n="invite.body"></p>
      </div>
    </div>
  </section>

  <!-- ── programme ───────────────────────────────────────────────────── -->
  <section class="section section--tinted">
    <div class="wrap cards">

      <article class="card">
        <span class="card__tag" data-i18n="ceremony.tag"></span>
        <h3 class="card__title" data-i18n="ceremony.title"></h3>
        <p class="card__place" data-i18n="ceremony.venue"></p>
        <p class="card__meta" data-i18n="ceremony.address"></p>
        <div class="notice">
          <p data-i18n="ceremony.note"></p>
        </div>
      </article>

      <article class="card card--accent">
        <span class="card__tag" data-i18n="dinner.tag"></span>
        <h3 class="card__title" data-i18n="dinner.title"></h3>
        <p class="card__time">18:00</p>
        <p class="card__place" data-i18n="dinner.venue"></p>
        <p class="card__meta" data-i18n="dinner.note"></p>
      </article>

    </div>
  </section>

  <!-- ── countdown ───────────────────────────────────────────────────── -->
  <section class="section">
    <div class="wrap center">
      <h2 class="section__title" data-i18n="countdown.title"></h2>
      <ul class="countdown" id="countdown">
        <li><strong data-cd="days">–</strong><span data-i18n="countdown.days"></span></li>
        <li><strong data-cd="hours">–</strong><span data-i18n="countdown.hours"></span></li>
        <li><strong data-cd="minutes">–</strong><span data-i18n="countdown.minutes"></span></li>
        <li><strong data-cd="seconds">–</strong><span data-i18n="countdown.seconds"></span></li>
      </ul>
    </div>
  </section>

  <!-- ── RSVP ────────────────────────────────────────────────────────── -->
  <section class="section section--dark" id="rsvp">
    <div class="wrap wrap--narrow">
      <div class="center">
        <h2 class="section__title" data-i18n="rsvp.title"></h2>
        <p class="deadline" data-i18n="rsvp.deadline"></p>
      </div>

      <form class="form" id="rsvpForm" novalidate>

        <div class="grid-2">
          <label class="field">
            <span class="field__label" data-i18n="form.firstName"></span>
            <input type="text" name="firstName" autocomplete="given-name" required>
            <em class="field__error" data-i18n="form.required"></em>
          </label>

          <label class="field">
            <span class="field__label" data-i18n="form.lastName"></span>
            <input type="text" name="lastName" autocomplete="family-name" required>
            <em class="field__error" data-i18n="form.required"></em>
          </label>
        </div>

        <fieldset class="field field--choice">
          <legend class="field__label" data-i18n="form.attending"></legend>
          <div class="choices">
            <label class="choice">
              <input type="radio" name="attending" value="Yes" required>
              <span data-i18n="form.yes"></span>
            </label>
            <label class="choice">
              <input type="radio" name="attending" value="No" required>
              <span data-i18n="form.no"></span>
            </label>
          </div>
          <em class="field__error" data-i18n="form.requiredChoice"></em>
        </fieldset>

        <div id="attendingOnly" hidden>
          <fieldset class="field field--choice">
            <legend class="field__label" data-i18n="form.diet"></legend>
            <div class="choices choices--wrap" id="dietChoices">
              <label class="choice"><input type="checkbox" name="diet" value="Vegetarian"><span data-i18n="diet.vegetarian"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Vegan"><span data-i18n="diet.vegan"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Pescatarian"><span data-i18n="diet.pescatarian"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Gluten-free"><span data-i18n="diet.gluten"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Lactose-free"><span data-i18n="diet.lactose"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="No pork"><span data-i18n="diet.pork"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Nut allergy"><span data-i18n="diet.nuts"></span></label>
              <label class="choice"><input type="checkbox" name="diet" value="Shellfish allergy"><span data-i18n="diet.shellfish"></span></label>
            </div>
          </fieldset>

          <label class="field">
            <span class="field__label" data-i18n="form.allergies"></span>
            <textarea name="allergies" rows="3" data-i18n-attr="placeholder:form.allergiesHint"></textarea>
          </label>
        </div>

        <label class="field">
          <span class="field__label" data-i18n="form.email"></span>
          <input type="email" name="email" autocomplete="email" required>
          <em class="field__error" data-err="empty" data-i18n="form.required"></em>
          <em class="field__error" data-err="invalid" data-i18n="form.emailInvalid"></em>
        </label>

        <label class="field">
          <span class="field__label">
            <span data-i18n="form.message"></span>
            <small data-i18n="form.optional"></small>
          </span>
          <textarea name="message" rows="3"></textarea>
        </label>

        <button class="btn btn--gold" type="submit" id="submitBtn">
          <span data-i18n="form.submit"></span>
        </button>

        <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <div class="thanks" id="thanks" hidden>
        <svg class="thanks__mark" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M24 4a20 20 0 1 1 0 40 20 20 0 0 1 0-40M15 24l6 7 12-14"/>
        </svg>
        <h3 id="thanksTitle"></h3>
        <p id="thanksBody"></p>
        <button class="btn btn--ghost btn--sm" type="button" id="editAgain" data-i18n="thanks.edit"></button>
      </div>
    </div>
  </section>

  <!-- ── practical ───────────────────────────────────────────────────── -->
  <section class="section">
    <div class="wrap wrap--narrow center">
      <h2 class="section__title" data-i18n="info.title"></h2>
      <dl class="info">
        <div><dt data-i18n="info.dressLabel"></dt><dd data-i18n="info.dress"></dd></div>
        <div><dt data-i18n="info.giftsLabel"></dt><dd data-i18n="info.gifts"></dd></div>
        <div><dt data-i18n="info.contactLabel"></dt><dd><a id="contactLink" href="#"></a></dd></div>
      </dl>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="flags" aria-hidden="true">
    <svg viewBox="0 0 30 20" class="flag"><title>Sweden</title>
      <rect width="30" height="20" fill="#005293"/>
      <rect x="9" width="4" height="20" fill="#fecb00"/>
      <rect y="8" width="30" height="4" fill="#fecb00"/>
    </svg>
    <svg viewBox="0 0 30 20" class="flag"><title>Greece</title>
      <rect width="30" height="20" fill="#0d5eaf"/>
      <g fill="#fff"><rect y="2.22" width="30" height="2.22"/><rect y="6.67" width="30" height="2.22"/>
      <rect y="11.11" width="30" height="2.22"/><rect y="15.56" width="30" height="2.22"/></g>
      <rect width="12.22" height="13.33" fill="#0d5eaf"/>
      <g fill="#fff"><rect x="4.44" width="3.33" height="13.33"/><rect y="4.44" width="12.22" height="3.33"/></g>
    </svg>
    <svg viewBox="0 0 30 20" class="flag"><title>Croatia</title>
      <rect width="30" height="6.67" fill="#ff0000"/>
      <rect y="6.67" width="30" height="6.67" fill="#fff"/>
      <rect y="13.33" width="30" height="6.67" fill="#171796"/>
      <g transform="translate(12 5)">
        <rect width="6" height="6" fill="#fff"/>
        <g fill="#ff0000"><rect width="1.5" height="1.5"/><rect x="3" width="1.5" height="1.5"/>
        <rect x="1.5" y="1.5" width="1.5" height="1.5"/><rect x="4.5" y="1.5" width="1.5" height="1.5"/>
        <rect y="3" width="1.5" height="1.5"/><rect x="3" y="3" width="1.5" height="1.5"/>
        <rect x="1.5" y="4.5" width="1.5" height="1.5"/><rect x="4.5" y="4.5" width="1.5" height="1.5"/></g>
      </g>
    </svg>
  </div>
  <p class="footer__route" data-i18n="footer.route"></p>
  <p class="footer__names">Argyrios &amp; Tomislav</p>
  <p class="footer__date">10 · 04 · 2027</p>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
